<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MajiMonitor - Filter Maintenance</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
            <i data-feather="chevron-left"></i>
        </button>

        <div class="sidebar-brand">
            <span class="sidebar-brand-icon"></span>
            <span class="brand-label">MajiMonitor</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" title="Dashboard"><i data-feather="grid"></i> <span class="nav-label">Dashboard</span></a>
            <a href="alerts.html" title="Alerts"><i data-feather="alert-triangle"></i> <span class="nav-label">Alerts</span></a><a href="pipes.html" title="Pipe Network"><i data-feather="activity"></i> <span class="nav-label">Pipe Network</span></a>
            <a href="officers.html" title="Officers"><i data-feather="users"></i> <span class="nav-label">Officers</span></a>
            <a href="site-management.html" title="Site Management"><i data-feather="map-pin"></i> <span class="nav-label">Site Management</span></a>
             <a href="filters.html" class="active" title="Water Filters"><i data-feather="filter"></i> <span class="nav-label">Water Filters</span></a>
            <a href="profile.html" title="My Profile"><i data-feather="settings"></i> <span class="nav-label">My Profile</span></a>
            <a href="help.html" title="Help Center"><i data-feather="help-circle"></i> <span class="nav-label">Help Center</span></a>
            <a href="reports.html" title="Reports &amp; Analytics"><i data-feather="bar-chart-2"></i> <span class="nav-label">Reports &amp; Analytics</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user" id="sidebar-user"></div>
            <button id="logout-btn" title="Log Out"><i data-feather="log-out"></i> <span class="logout-label">Log Out</span></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="panel">
            <h1>Water Filter Maintenance</h1>
            <p>Track filter servicing status across all monitoring sites</p>
        </div>

        <div class="stat-row" id="filter-stat-row">
            <!-- populated by filters.js -->
        </div>

        <div class="panel">
            <h2>Add New Filter</h2>
            <form id="add-filter-form">
                <label for="filter-site">Site</label>
                <select id="filter-site" required></select>

                <label for="filter-type">Filter Type</label>
                <input type="text" id="filter-type" placeholder="e.g. Sediment Filter" required>

                <label for="filter-install-date">Installation Date</label>
                <input type="date" id="filter-install-date" required>

                <label for="filter-serviced-date">Last Serviced Date</label>
                <input type="date" id="filter-serviced-date" required>

                <label for="filter-interval">Service Interval (days)</label>
                <input type="number" id="filter-interval" value="90" required>

                <label for="filter-notes">Notes</label>
                <input type="text" id="filter-notes" placeholder="Optional">

                <button type="submit">Add Filter</button>
            </form>
            <p id="add-filter-message"></p>
        </div>

        <div class="panel">
            <h2>All Filters</h2>
            <div id="filters-list">
                <!-- populated by filters.js -->
            </div>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/logo.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/filters.js"></script>
</body>
</html>
