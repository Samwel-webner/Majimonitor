<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MajiMonitor - Alerts</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
            <i data-feather="chevron-left"></i>
        </button>

        <div class="sidebar-brand">
            <span class="sidebar-brand-icon"></span>
            <span class="brand-label">MajiMonitor</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" title="Dashboard"><i data-feather="grid"></i> <span class="nav-label">Dashboard</span></a>
            <a href="alerts.html" class="active" title="Alerts"><i data-feather="alert-triangle"></i> <span class="nav-label">Alerts</span></a><a href="pipes.html" title="Pipe Network"><i data-feather="activity"></i> <span class="nav-label">Pipe Network</span></a>
            <a href="officers.html" title="Officers"><i data-feather="users"></i> <span class="nav-label">Officers</span></a>
            <a href="site-management.html" title="Site Management"><i data-feather="map-pin"></i> <span class="nav-label">Site Management</span></a>
            <a href="filters.html" title="Water Filters"><i data-feather="filter"></i> <span class="nav-label">Water Filters</span></a>
            <a href="profile.html" title="My Profile"><i data-feather="settings"></i> <span class="nav-label">My Profile</span></a>
            <a href="help.html" title="Help Center"><i data-feather="help-circle"></i> <span class="nav-label">Help Center</span></a>
            <a href="reports.html" title="Reports &amp; Analytics"><i data-feather="bar-chart-2"></i> <span class="nav-label">Reports &amp; Analytics</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user" id="sidebar-user"></div>
            <button id="logout-btn" title="Log Out"><i data-feather="log-out"></i> <span class="logout-label">Log Out</span></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="panel">
            <h1>Alerts Log</h1>
            <p>Threshold breaches across all monitoring sites</p>
        </div>

        <button id="export-alerts-btn">Export All Alerts (CSV)</button>

        <div id="tabs">
            <span class="tab active" data-status="active">Active</span>
            <span class="tab" data-status="acknowledged">Acknowledged</span>
            <span class="tab" data-status="resolved">Resolved</span>
            <span class="tab" data-status="">All</span>
        </div>

        <div id="alerts-container">
            <!-- populated by alerts.js -->
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/alerts.js"></script>
</body>
</html>
