<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MajiMonitor - Reset Password</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <span>MajiMonitor</span>
        </div>
        <p class="login-subtitle">Set a new password</p>

        <form id="reset-form">
            <label for="password">New Password</label>
            <input type="password" id="password" required>
            <button type="submit">Reset Password</button>
        </form>

        <p id="reset-message"></p>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
function getTokenFromUrl() {
    return new URLSearchParams(window.location.search).get('token');
}

document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const token = getTokenFromUrl();
    const messageEl = document.getElementById('reset-message');

    if (!token) {
        messageEl.textContent = 'No reset token found in the link.';
        return;
    }

    try {
        const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (!res.ok) {
            messageEl.textContent = data.error;
            messageEl.style.color = 'var(--color-critical)';
            return;
        }

        messageEl.textContent = 'Password updated! Redirecting to login...';
        messageEl.style.color = 'var(--color-safe)';
        setTimeout(() => window.location.href = 'login.html', 2000);
    } catch (err) {
        messageEl.textContent = 'Something went wrong. Try again.';
        console.error(err);
    }
});
</script>
</body>
</html>
