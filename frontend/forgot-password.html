<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MajiMonitor - Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <span>MajiMonitor</span>
        </div>
        <p class="login-subtitle">Reset your password</p>

        <form id="forgot-form">
            <label for="email">Email</label>
            <input type="email" id="email" required>
            <button type="submit">Send Reset Link</button>
        </form>

        <p id="forgot-message"></p>

        <p style="margin-top:16px; font-size:0.85rem;"><a href="login.html">Back to Login</a></p>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const messageEl = document.getElementById('forgot-message');

    try {
        const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        messageEl.textContent = data.message;
        messageEl.style.color = 'var(--color-safe)';
    } catch (err) {
        messageEl.textContent = 'Something went wrong. Try again.';
        console.error(err);
    }
});
</script>
</body>
</html>
