<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MajiMonitor - Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
            <i data-feather="chevron-left"></i>
        </button>

        <div class="sidebar-brand">
            <span class="sidebar-brand-icon"></span>
            <span class="brand-label">MajiMonitor</span>
        </div>

        <nav class="sidebar-nav">
    <a href="index.html" class="active" title="Dashboard"><i data-feather="grid"></i> <span class="nav-label">Dashboard</span></a>
    <a href="alerts.html" title="Alerts"><i data-feather="alert-triangle"></i> <span class="nav-label">Alerts</span></a>
    <a href="officers.html" title="Officers"><i data-feather="users"></i> <span class="nav-label">Officers</span></a>
    <a href="site-management.html" title="Site Management"><i data-feather="map-pin"></i> <span class="nav-label">Site Management</span></a>
    <a href="filters.html" title="Water Filters"><i data-feather="filter"></i> <span class="nav-label">Water Filters</span></a>
    <a href="profile.html" title="My Profile"><i data-feather="settings"></i> <span class="nav-label">My Profile</span></a>
    <a href="help.html" title="Help Center"><i data-feather="help-circle"></i> <span class="nav-label">Help Center</span></a>
    <a href="reports.html" title="Reports &amp; Analytics"><i data-feather="bar-chart-2"></i> <span class="nav-label">Reports &amp; Analytics</span></a>
</nav>
        <div class="sidebar-footer">
            <div class="sidebar-user" id="sidebar-user"></div>
            <button id="logout-btn" title="Log Out"><i data-feather="log-out"></i> <span class="logout-label">Log Out</span></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="panel">
            <h1>Basin Overview</h1>
            <p>Live water quality status across all monitoring sites</p>
            <p id="welcome-message"></p>
        </div>

        <div class="stat-row" id="stat-row">
            <!-- populated by dashboard.js -->
        </div>

        <p class="last-updated" id="last-updated"></p>

        <div class="dashboard-columns">
            <div class="dashboard-main">
                <div class="chart-panel">
                    <h2>Active Alerts by Site</h2>
                    <canvas id="alerts-by-site-chart" height="80"></canvas>
                </div>

                <h2>Monitoring Sites</h2>
                <div id="site-grid">
                    <!-- populated by dashboard.js -->
                </div>
            </div>

            <div class="dashboard-side">
                <div class="panel">
                    <h2>Recent Alerts</h2>
                    <div id="recent-alerts">
                        <!-- populated by dashboard.js -->
                    </div>
                </div>

                <div class="panel">
                    <h2>Field Officers</h2>
                    <div id="officers-list">
                        <!-- populated by dashboard.js -->
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/logo.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
