<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MajiMonitor - 3D Pipe View</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; font-family: Arial, Helvetica, sans-serif; }
    #pipe-3d { width: 100%; height: 100%; touch-action: none; }
    #pipe-3d canvas { display: block; }
    .pipe-3d-msg { color: #fff; padding: 24px; text-align: center; }
    .zoom-bar { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
    .zoom-bar button { width: 40px; height: 40px; font-size: 22px; line-height: 1; color: #fff; background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(148, 163, 184, 0.55); border-radius: 8px; }
    .hidden { display: none; }
</style>
</head>
<body>

<div id="pipe-3d"></div>

<div class="zoom-bar">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">&minus;</button>
</div>

<!-- pipes.js fills these in for the web page; here they are just hidden placeholders -->
<div id="pipe-summary" class="hidden"></div>
<div id="pipe-grid" class="hidden"></div>

<script src="js/config.js"></script>
<script>
    // pipes.js expects apiGet() and feather from the full web page. This page has neither, so provide small versions.
    function apiGet(path) {
        return fetch(API_BASE_URL + path).then(res => {
            if (!res.ok) throw new Error('GET ' + path + ' failed (' + res.status + ')');
            return res.json();
        });
    }
    window.feather = { replace: function () {} };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/pipes.js"></script>
<script>
    // Runs after pipes.js: make the 3D view fill the whole screen and add zoom buttons for touch
    function fitToScreen() {
        if (!threeReady) return;
        CONFIG.viewHeight = window.innerHeight;
        resizeThree();
    }
    fitToScreen();
    window.addEventListener('resize', fitToScreen);

    function zoomBy(amount) {
        userZoomed = true;
        camTargetZ = Math.max(CONFIG.camera.minZ, Math.min(CONFIG.camera.maxZ, camTargetZ + amount));
    }
    document.getElementById('zoom-in').addEventListener('click', function () { zoomBy(-2); });
    document.getElementById('zoom-out').addEventListener('click', function () { zoomBy(2); });
</script>
</body>
</html>
